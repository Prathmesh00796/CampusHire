version: '3.9'

services:
  # ─── MySQL Database ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: campushire_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-campushire_db}
      MYSQL_USER: ${DB_USER:-campushire_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-campushire_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - campushire_net

  # ─── Backend Express API ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushire_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-campushire_db}
      DB_USER: ${DB_USER:-campushire_user}
      DB_PASSWORD: ${DB_PASSWORD:-campushire_pass}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_change_in_production}
      JWT_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
    ports:
      - "5000:5000"
    networks:
      - campushire_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Frontend Nginx ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campushire_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - campushire_net

# ─── Named Volumes ───────────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local

# ─── Networks ────────────────────────────────────────────────────────────────
networks:
  campushire_net:
    driver: bridge
